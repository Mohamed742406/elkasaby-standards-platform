<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المعايير الهندسية - Elkasaby Standards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header */
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            font-size: 28px;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .auth-buttons {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #667eea;
        }
        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }
        .btn-danger {
            background: #ff6b6b;
            color: white;
        }
        .btn-danger:hover {
            background: #ff5252;
        }
        .btn-success {
            background: #51cf66;
            color: white;
        }
        .btn-success:hover {
            background: #40c057;
        }

        /* Message */
        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        /* Statistics */
        .statistics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .stat-card h3 {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
        }
        .stat-card p {
            color: #666;
            font-size: 14px;
        }

        /* Upload Section */
        .upload-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: none;
        }
        .upload-section.admin-visible {
            display: block;
        }
        .upload-section h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Standards Grid */
        .standards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .standard-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .standard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }
        .standard-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 20px;
        }
        .standard-card p {
            color: #666;
            font-size: 14px;
        }

        /* Files List */
        .files-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: none;
        }
        .files-section h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .file-item {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-info {
            flex: 1;
        }
        .file-info h4 {
            color: #333;
            margin-bottom: 5px;
        }
        .file-info p {
            color: #666;
            font-size: 12px;
        }
        .file-actions {
            display: flex;
            gap: 10px;
        }

        /* Comments Section */
        .comments-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .comments-section h5 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .comment {
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-right: 3px solid #667eea;
        }
        .comment-author {
            font-weight: bold;
            color: #333;
            font-size: 12px;
        }
        .comment-date {
            color: #999;
            font-size: 11px;
        }
        .comment-content {
            color: #666;
            margin-top: 5px;
            font-size: 13px;
        }
        .add-comment {
            margin-top: 10px;
        }
        .add-comment textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 13px;
            min-height: 60px;
        }

        /* Rating Section */
        .rating-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .rating-section h5 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .stars {
            display: flex;
            gap: 5px;
            font-size: 24px;
            cursor: pointer;
        }
        .star {
            color: #ddd;
            transition: color 0.2s;
        }
        .star.active,
        .star.hover {
            color: #ffc107;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 {
            color: #667eea;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }
        .close-btn:hover {
            color: #333;
        }

        /* Search */
        .search-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 10px;
        }
        .search-section input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        /* Platform Rating */
        .platform-rating-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: none;
        }
        .platform-rating-section h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .rating-input {
            margin-bottom: 15px;
        }
        .rating-input label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 500;
        }
        .rating-comments {
            margin-top: 20px;
        }
        .rating-comment {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-right: 3px solid #ffc107;
        }
        .rating-comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .rating-comment-author {
            font-weight: bold;
            color: #333;
        }
        .rating-stars {
            color: #ffc107;
        }
        .rating-comment-text {
            color: #666;
            font-size: 13px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }
            header h1 {
                font-size: 20px;
            }
            .auth-buttons {
                width: 100%;
            }
            .auth-buttons button {
                flex: 1;
            }
            .file-item {
                flex-direction: column;
                gap: 10px;
            }
            .file-actions {
                width: 100%;
            }
            .file-actions button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🏗️ منصة المعايير الهندسية</h1>
            <div class="auth-buttons">
                <button class="btn-primary" id="loginBtn" onclick="openLoginModal()">تسجيل الدخول</button>
                <button class="btn-secondary" id="registerBtn" onclick="openRegisterModal()">إنشاء حساب</button>
                <button class="btn-danger" id="logoutBtn" onclick="logout()" style="display:none">خروج</button>
            </div>
        </header>

        <!-- Message -->
        <div id="message" class="message"></div>

        <!-- Statistics -->
        <div class="statistics" id="statistics"></div>

        <!-- Upload Section (Admin Only) -->
        <div class="upload-section" id="uploadSection">
            <h2>رفع ملف جديد</h2>
            <form id="uploadForm" onsubmit="uploadFile(event)">
                <div class="form-group">
                    <label>المعيار</label>
                    <select id="standardSelect" required>
                        <option value="">-- اختر معيار --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>عنوان الملف</label>
                    <input type="text" id="fileTitle" placeholder="ACI 214R-11" required>
                </div>
                <div class="form-group">
                    <label>الوصف</label>
                    <textarea id="fileDescription" placeholder="وصف مختصر للملف..."></textarea>
                </div>
                <div class="form-group">
                    <label>الملف</label>
                    <input type="file" id="fileInput" required>
                </div>
                <button type="submit" class="btn-success">رفع الملف</button>
            </form>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="ابحث في الملفات...">
            <button class="btn-primary" onclick="searchFiles()">بحث</button>
        </div>

        <!-- Standards -->
        <div class="standards-grid" id="standardsGrid"></div>

        <!-- Files Section -->
        <div class="files-section" id="filesSection" style="display:none">
            <h2 id="filesTitle">الملفات</h2>
            <div id="filesList"></div>
        </div>

        <!-- Platform Rating Section -->
        <div class="platform-rating-section" id="platformRatingSection" style="display:none">
            <h2>تقييم المنصة</h2>
            <div class="rating-input">
                <label>التقييم</label>
                <div class="stars" id="platformRatingStars"></div>
            </div>
            <div class="form-group">
                <label>تعليق (اختياري)</label>
                <textarea id="platformComment" placeholder="رأيك في المنصة..."></textarea>
            </div>
            <button class="btn-success" onclick="submitPlatformRating()">إرسال التقييم</button>
            <div class="rating-comments" id="platformComments" style="margin-top: 30px">
                <h3>آراء الزوار</h3>
                <div id="platformCommentsList"></div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>تسجيل الدخول</h2>
                <button class="close-btn" onclick="closeLoginModal()">&times;</button>
            </div>
            <form onsubmit="login(event)">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="loginUsername" required>
                </div>
                <div class="form-group">
                    <label>كلمة السر</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%">دخول</button>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>إنشاء حساب</h2>
                <button class="close-btn" onclick="closeRegisterModal()">&times;</button>
            </div>
            <form onsubmit="register(event)">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="registerUsername" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label>كلمة السر</label>
                    <input type="password" id="registerPassword" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%">إنشاء حساب</button>
            </form>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="adminLoginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>دخول الأدمن</h2>
                <button class="close-btn" onclick="closeAdminLoginModal()">&times;</button>
            </div>
            <form onsubmit="adminLogin(event)">
                <div class="form-group">
                    <label>كلمة السر الإدارية</label>
                    <input type="password" id="adminPassword" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%">دخول الأدمن</button>
            </form>
        </div>
    </div>

    <script>
        // Global Variables
        let currentUser = null;
        let currentStandardId = null;
        let adminToken = null;
        let userToken = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadStatistics();
            loadStandards();
            checkAdminStatus();
            checkUserStatus();
        });

        // Authentication
        function openLoginModal() {
            document.getElementById('loginModal').classList.add('show');
        }
        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('show');
        }
        function openRegisterModal() {
            document.getElementById('registerModal').classList.add('show');
        }
        function closeRegisterModal() {
            document.getElementById('registerModal').classList.remove('show');
        }
        function openAdminLoginModal() {
            document.getElementById('adminLoginModal').classList.add('show');
        }
        function closeAdminLoginModal() {
            document.getElementById('adminLoginModal').classList.remove('show');
        }

        async function login(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (data.success) {
                    currentUser = data.user;
                    userToken = data.token; // ✅ إصلاح: استخدام data.token مش data.user.id
                    localStorage.setItem('userToken', userToken);
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    showMessage('تم تسجيل الدخول بنجاح', 'success');
                    closeLoginModal();
                    updateAuthUI();
                    loadPlatformRating();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('حدث خطأ', 'error');
            }
        }

        async function register(e) {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await response.json();
                if (data.success) {
                    showMessage('تم التسجيل بنجاح!', 'success');
                    closeRegisterModal();
                    document.getElementById('registerUsername').value = '';
                    document.getElementById('registerEmail').value = '';
                    document.getElementById('registerPassword').value = '';
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('حدث خطأ', 'error');
            }
        }

        async function adminLogin(e) {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await response.json();
                if (data.success) {
                    adminToken = data.token;
                    localStorage.setItem('adminToken', adminToken);
                    showMessage('تم تسجيل دخول الأدمن', 'success');
                    closeAdminLoginModal();
                    updateAuthUI();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('حدث خطأ', 'error');
            }
        }

        function logout() {
            localStorage.removeItem('userToken');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('adminToken');
            currentUser = null;
            userToken = null;
            adminToken = null;
            updateAuthUI();
            showMessage('تم تسجيل الخروج بنجاح', 'success');
        }

        function updateAuthUI() {
            const loginBtn = document.getElementById('loginBtn');
            const registerBtn = document.getElementById('registerBtn');
            const logoutBtn = document.getElementById('logoutBtn');

            if (currentUser) {
                loginBtn.style.display = 'none';
                registerBtn.style.display = 'none';
                logoutBtn.style.display = 'block';
                logoutBtn.textContent = `خروج (${currentUser.username})`;
                document.getElementById('platformRatingSection').style.display = 'block';
            } else {
                loginBtn.style.display = 'block';
                registerBtn.style.display = 'block';
                logoutBtn.style.display = 'none';
                document.getElementById('platformRatingSection').style.display = 'none';
            }

            if (adminToken) {
                document.getElementById('uploadSection').classList.add('admin-visible');
            } else {
                document.getElementById('uploadSection').classList.remove('admin-visible');
            }
        }

        function checkAdminStatus() {
            adminToken = localStorage.getItem('adminToken');
            if (adminToken) updateAuthUI();
        }

        function checkUserStatus() {
            userToken = localStorage.getItem('userToken');
            const userStr = localStorage.getItem('currentUser');
            if (userToken && userStr) {
                currentUser = JSON.parse(userStr);
                updateAuthUI();
            }
        }

        // Standards & Files
        async function loadStatistics() {
            try {
                const response = await fetch('/api/statistics');
                const stats = await response.json();
                const statsHtml = stats.map(stat => `
                    <div class="stat-card">
                        <h3>${stat.fileCount}</h3>
                        <p>${stat.icon} ${stat.name}</p>
                        <p style="font-size: 12px; color: #999;">${stat.totalDownloads} تحميل</p>
                    </div>
                `).join('');
                document.getElementById('statistics').innerHTML = statsHtml;
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        async function loadStandards() {
            try {
                const response = await fetch('/api/standards');
                const standards = await response.json();
                const standardsHtml = standards.map(standard => `
                    <div class="standard-card" onclick="selectStandard(${standard.id}, '${standard.name}')">
                        <h3>${standard.icon} ${standard.name}</h3>
                        <p>${standard.description}</p>
                    </div>
                `).join('');
                document.getElementById('standardsGrid').innerHTML = standardsHtml;

                // Populate select for upload
                const selectHtml = standards.map(standard => 
                    `<option value="${standard.id}">${standard.icon} ${standard.name}</option>`
                ).join('');
                document.getElementById('standardSelect').innerHTML = `<option value="">-- اختر معيار --</option>` + selectHtml;
            } catch (error) {
                console.error('Error loading standards:', error);
            }
        }

        async function selectStandard(standardId, standardName) {
            currentStandardId = standardId;
            document.getElementById('filesTitle').textContent = standardName;
            await loadFiles(standardId);
            document.getElementById('filesSection').style.display = 'block';
            document.getElementById('filesSection').scrollIntoView({ behavior: 'smooth' });
        }

        async function loadFiles(standardId) {
            try {
                const response = await fetch(`/api/standards/${standardId}/files`);
                const files = await response.json();
                if (files.length === 0) {
                    document.getElementById('filesList').innerHTML = '<p style="text-align: center; color: #999;">لا توجد ملفات</p>';
                    return;
                }
                const filesHtml = await Promise.all(files.map(async (file) => {
                    const comments = await fetch(`/api/files/${file.id}/comments`).then(r => r.json());
                    const ratings = await fetch(`/api/files/${file.id}/ratings`).then(r => r.json());
                    return `
                        <div class="file-item" style="flex-direction: column; align-items: flex-start;">
                            <div class="file-info" style="width: 100%;">
                                <h4>${file.title}</h4>
                                <p>${file.description || ''}</p>
                                <p style="font-size: 12px; color: #999;">${file.downloads} تحميل | ${(file.filesize / 1024).toFixed(2)} KB</p>
                            </div>
                            <div class="file-actions" style="width: 100%; margin-top: 10px;">
                                <button class="btn-primary" onclick="downloadFile(${file.id})" style="flex: 1;">تحميل</button>
                                ${adminToken ? `<button class="btn-danger" onclick="deleteFile(${file.id})" style="flex: 1;">حذف</button>` : ''}
                            </div>
                            <div class="comments-section" style="width: 100%;">
                                <h5>${comments.length} تعليق</h5>
                                <div id="comments-${file.id}">
                                    ${comments.map(c => `
                                        <div class="comment">
                                            <span class="comment-author">${c.username}</span>
                                            <span class="comment-date">${new Date(c.created_at).toLocaleDateString('ar-EG')}</span>
                                            <p class="comment-content">${c.content}</p>
                                        </div>
                                    `).join('')}
                                </div>
                                ${currentUser ? `
                                    <div class="add-comment">
                                        <textarea id="comment-input-${file.id}" placeholder="أضف تعليقك..."></textarea>
                                        <button class="btn-success" onclick="addComment(${file.id})" style="margin-top: 5px; width: 100%;">إرسال</button>
                                    </div>
                                ` : ''}
                            </div>
                            <div class="rating-section" style="width: 100%;">
                                <h5>${ratings.totalRatings} تقييم | ${ratings.averageRating.toFixed(1)}</h5>
                                ${currentUser ? `
                                    <div class="stars" id="rating-${file.id}"></div>
                                    <button class="btn-success" onclick="submitFileRating(${file.id})" style="margin-top: 10px; width: 100%;">تقييم</button>
                                ` : ''}
                                <p style="color: #999; font-size: 12px;">قم بتسجيل الدخول للتقييم</p>
                            </div>
                        </div>
                    `;
                }));
                document.getElementById('filesList').innerHTML = filesHtml.join('');
                
                // Initialize rating stars
                files.forEach(file => {
                    if (currentUser) initializeRatingStars(`rating-${file.id}`);
                });
            } catch (error) {
                console.error('Error loading files:', error);
            }
        }

        async function uploadFile(e) {
            e.preventDefault();
            if (!adminToken) {
                showMessage('يجب تسجيل دخول الأدمن أولاً', 'error');
                openAdminLoginModal();
                return;
            }
            const standardId = document.getElementById('standardSelect').value;
            const title = document.getElementById('fileTitle').value;
            const description = document.getElementById('fileDescription').value;
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) {
                showMessage('يرجى اختيار ملف', 'error');
                return;
            }
            const formData = new FormData();
            formData.append('standardId', standardId);
            formData.append('title', title);
            formData.append('description', description);
            formData.append('file', fileInput.files[0]);
            try {
                const response = await fetch('/api/files/upload', {
                    method: 'POST',
                    headers: { 'x-admin-token': adminToken },
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    showMessage('تم رفع الملف بنجاح', 'success');
                    document.getElementById('uploadForm').reset();
                    loadStatistics();
                    if (currentStandardId) loadFiles(currentStandardId);
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('حدث خطأ', 'error');
            }
        }

        function downloadFile(fileId) {
            window.location.href = `/api/files/${fileId}/download`;
        }

        async function deleteFile(fileId) {
            if (!confirm('هل أنت متأكد من حذف هذا الملف؟')) return;
            try {
                const response = await fetch(`/api/files/${fileId}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-token': adminToken }
                });
                const data = await response.json();
                if (data.success) {
                    showMessage('تم حذف الملف', 'success');
                    loadStatistics();
                    if (currentStandardId) loadFiles(currentStandardId);
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('حدث خطأ', 'error');
            }
        }

        // Comments
        async function addComment(fileId) {
            if (!currentUser) {
                showMessage('يجب تسجيل الدخول أولاً', 'error');
                return;
            }
            const content = document.getElementById(`comment-input-${fileId}`).value;
            if (!content.trim()) {
                showMessage('التعليق لا يمكن أن يكون فارغاً', 'error');
                return;
            }
            try {
                const response = await fetch(`/api/files/${fileId}/comments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-token': userToken
                    },
                    body: JSON.stringify({ content })
                });
                const data = await response.json();
                if (data.success) {
                    showMessage('تم إضافة التعليق', 'success');
                    document.getElementById(`comment-input-${fileId}`).value = '';
                    loadFiles(currentStandardId);
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('حدث خطأ', 'error');
            }
        }

        // Ratings
        function initializeRatingStars(elementId) {
            const starsContainer = document.getElementById(elementId);
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                starsHtml += `<span class="star" data-rating="${i}" onclick="setRating(this, '${elementId}')">*</span>`;
            }
            starsContainer.innerHTML = starsHtml;
        }

        function setRating(element, elementId) {
            const rating = element.dataset.rating;
            const stars = document.querySelectorAll(`${elementId} .star`);
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
            element.parentElement.dataset.selectedRating = rating;
        }

        async function submitFileRating(fileId) {
            if (!currentUser) {
                showMessage('يجب تسجيل الدخول أولاً', 'error');
                return;
            }
            const rating = document.getElementById(`rating-${fileId}`).dataset.selectedRating;
            if (!rating) {
                showMessage('يرجى اختيار تقييم', 'error');
                return;
            }
            try {
                const response = await fetch(`/api/files/${fileId}/ratings`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-token': userToken
                    },
                    body: JSON.stringify({ rating: parseInt(rating) })
                });
                const data = await response.json();
                if (data.success) {
                    showMessage('تم حفظ التقييم', 'success');
                    loadFiles(currentStandardId);
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('حدث خطأ', 'error');
            }
        }

        // Platform Rating
        function initializePlatformRatingStars() {
            const starsContainer = document.getElementById('platformRatingStars');
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                starsHtml += `<span class="star" data-rating="${i}" onmouseover="hoverRating(this)" onmouseout="unhoverRating()" onclick="setPlatformRating(this)">★</span>`;
            }
            starsContainer.innerHTML = starsHtml;
        }

        function hoverRating(element) {
            const rating = element.dataset.rating;
            const stars = document.querySelectorAll('#platformRatingStars .star');
            stars.forEach(star => {
                if (star.dataset.rating <= rating) {
                    star.classList.add('hover');
                } else {
                    star.classList.remove('hover');
                }
            });
        }

        function unhoverRating() {
            const stars = document.querySelectorAll('#platformRatingStars .star');
            stars.forEach(star => star.classList.remove('hover'));
        }

        function setPlatformRating(element) {
            const rating = element.dataset.rating;
            const stars = document.querySelectorAll('#platformRatingStars .star');
            stars.forEach(star => {
                if (star.dataset.rating <= rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
            document.getElementById('platformRatingStars').dataset.selectedRating = rating;
        }

        async function loadPlatformRating() {
            if (!currentUser) return;
            try {
                const response = await fetch('/api/platform/ratings/all');
                const ratings = await response.json();
                const commentsHtml = ratings.map(r => `
                    <div class="rating-comment">
                        <div class="rating-comment-header">
                            <span class="rating-comment-author">${r.username}</span>
                            <span class="rating-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                        </div>
                        ${r.comment ? `<p class="rating-comment-text">${r.comment}</p>` : ''}
                    </div>
                `).join('');
                document.getElementById('platformCommentsList').innerHTML = commentsHtml;
                initializePlatformRatingStars();
            } catch (error) {
                console.error('Error loading platform ratings:', error);
            }
        }

        async function submitPlatformRating() {
            if (!currentUser) {
                showMessage('يجب تسجيل الدخول أولاً', 'error');
                return;
            }
            const rating = document.getElementById('platformRatingStars').dataset.selectedRating;
            const comment = document.getElementById('platformComment').value;
            if (!rating) {
                showMessage('يرجى اختيار تقييم', 'error');
                return;
            }
            try {
                const response = await fetch('/api/platform/ratings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-token': userToken
                    },
                    body: JSON.stringify({ rating: parseInt(rating), comment })
                });
                const data = await response.json();
                if (data.success) {
                    showMessage('شكراً لتقييمك!', 'success');
                    document.getElementById('platformComment').value = '';
                    loadPlatformRating();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('حدث خطأ', 'error');
            }
        }

        // Search
        async function searchFiles() {
            const query = document.getElementById('searchInput').value;
            if (!query.trim()) {
                showMessage('يرجى كتابة كلمة للبحث', 'error');
                return;
            }
            try {
                const response = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
                const files = await response.json();
                if (files.length === 0) {
                    document.getElementById('filesList').innerHTML = '<p style="text-align: center; color: #999;">لا توجد نتائج</p>';
                } else {
                    const filesHtml = files.map(file => `
                        <div class="file-item" style="flex-direction: column; align-items: flex-start;">
                            <div class="file-info" style="width: 100%;">
                                <h4>${file.title}</h4>
                                <p>${file.description || ''}</p>
                            </div>
                            <div class="file-actions" style="width: 100%; margin-top: 10px;">
                                <button class="btn-primary" onclick="downloadFile(${file.id})" style="flex: 1;">تحميل</button>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('filesList').innerHTML = filesHtml;
                }
                document.getElementById('filesSection').style.display = 'block';
                document.getElementById('filesTitle').textContent = `"${query}"`;
                document.getElementById('filesSection').scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                showMessage('حدث خطأ', 'error');
            }
        }

        // Utility Functions
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // Close modals when clicking outside
        window.onclick = function(event) {
            const loginModal = document.getElementById('loginModal');
            const registerModal = document.getElementById('registerModal');
            const adminLoginModal = document.getElementById('adminLoginModal');
            if (event.target === loginModal) closeLoginModal();
            if (event.target === registerModal) closeRegisterModal();
            if (event.target === adminLoginModal) closeAdminLoginModal();
        }
    </script>
</body>
</html>
